<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register - StackScout</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="/static/css/output.css" rel="stylesheet" />
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Inter', sans-serif;
        }

        .fade-in {
            animation: fadeIn 0.8s ease-in-out;
        }

        .slide-up {
            animation: slideUp 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-icon {
            position: relative;
        }

        .input-icon i {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9CA3AF;
            pointer-events: none;
        }

        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 4px;
            transition: all 0.3s ease;
        }

        .strength-weak { background-color: #EF4444; width: 33%; }
        .strength-medium { background-color: #F59E0B; width: 66%; }
        .strength-strong { background-color: #10B981; width: 100%; }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-group {
            position: relative;
        }

        .error-message {
            position: absolute;
            bottom: -20px;
            left: 0;
            font-size: 0.75rem;
            color: #EF4444;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .error-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .success-icon {
            color: #10B981;
        }

        .error-icon {
            color: #EF4444;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 md:p-8">
    <div class="bg-white rounded-xl shadow-2xl p-6 sm:p-8 max-w-sm sm:max-w-md w-full fade-in">
        <div class="flex justify-center mb-6 slide-up">
            <img src="data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjYwIiB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZlcnNpb249IjEuMSI+CiAgPGRlZnM+CiAgICA8bGluZWFyR3JhZGllbnQgaWQ9ImdyYWQxIiB4MT0iMCUiIHkxPSIwJSIgeDI9IjEwMCUiIHkyPSIwJSI+CiAgICAgIDxzdG9wIG9mZnNldD0iMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiM2NjdlZWE7c3RvcC1vcGFjaXR5OjEiIC8+CiAgICAgIDxzdG9wIG9mZnNldD0iMTAwJSIgc3R5bGU9InN0b3AtY29sb3I6Izc2NGJhMjtzdG9wLW9wYWNpdHk6MSIgLz4KICAgIDwvbGluZWFyR3JhZGllbnQ+CiAgPC9kZWZzPgogIDxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iNjAiIGZpbGw9InVybCgjZ3JhZDEpIiByeD0iMTAiIHJ5PSIxMCIvPgogIDx0ZXh0IHg9IjEwMCIgeT0iMzgiIGZvbnQtZmFtaWx5PSJBcmlhbCwgc2Fucy1zZXJpZiIgZm9udC1zaXplPSIyOCIgaGVpZ2h0PSIxMCIgZmlsbD0id2hpdGUiIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtd2VpZ2h0PSJib2xkIj4KICAgIFN0YWNrU2NvdXQKICA8L3RleHQ+Cjwvc3ZnPg==" alt="StackScout Logo" class="h-12" />
        </div>
        <h2 class="text-3xl font-bold mb-2 text-center text-gray-800 slide-up">Create your account</h2>
        <p class="text-center text-gray-600 mb-6 slide-up">Join StackScout and find your dream job</p>

        <form id="registerForm" class="space-y-5">
            <div class="form-group slide-up">
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-user mr-2" aria-hidden="true"></i>Username
                </label>
                <div class="input-icon">
                    <input type="text" id="username" name="username" required minlength="3" maxlength="50"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                        placeholder="Choose a username" aria-describedby="username-error" />
                    <i id="username-icon" class="fas fa-check-circle success-icon hidden" aria-hidden="true"></i>
                </div>
                <div id="username-error" class="error-message" role="alert" aria-live="polite">Username must be 3-50 characters</div>
            </div>

            <div class="form-group slide-up">
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-envelope mr-2" aria-hidden="true"></i>Email
                </label>
                <div class="input-icon">
                    <input type="email" id="email" name="email" required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                        placeholder="Enter your email" aria-describedby="email-error" />
                    <i id="email-icon" class="fas fa-check-circle success-icon hidden" aria-hidden="true"></i>
                </div>
                <div id="email-error" class="error-message" role="alert" aria-live="polite">Please enter a valid email address</div>
            </div>

            <div class="form-group slide-up">
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-lock mr-2" aria-hidden="true"></i>Password
                </label>
                <div class="input-icon">
                    <input type="password" id="password" name="password" required minlength="6" maxlength="100"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                        placeholder="Create a strong password" aria-describedby="password-error password-strength" />
                    <i id="password-icon" class="fas fa-eye toggle-password cursor-pointer" style="pointer-events: auto;" aria-label="Toggle password visibility"></i>
                </div>
                <div class="password-strength" id="password-strength" role="progressbar" aria-valuemin="0" aria-valuemax="6" aria-valuenow="0" aria-label="Password strength"></div>
                <div id="password-error" class="error-message" role="alert" aria-live="polite">Password must be at least 6 characters</div>
            </div>

            <div class="form-group slide-up">
                <label for="full_name" class="block text-sm font-medium text-gray-700 mb-1">
                    <i class="fas fa-id-card mr-2" aria-hidden="true"></i>Full Name <span class="text-gray-500">(optional)</span>
                </label>
                <input type="text" id="full_name" name="full_name" maxlength="100"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-200"
                    placeholder="Enter your full name" />
            </div>

            <div class="form-group slide-up">
                <label for="terms" class="flex items-center">
                    <input type="checkbox" id="terms" name="terms" required
                        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded" aria-describedby="terms-error" />
                    <span class="ml-2 text-sm text-gray-700">
                        I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-500">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:text-indigo-500">Privacy Policy</a>
                    </span>
                </label>
                <div id="terms-error" class="error-message" role="alert" aria-live="polite">You must agree to the terms</div>
            </div>

            <button type="submit" id="submitBtn"
                class="w-full py-3 px-4 bg-indigo-600 text-white font-semibold rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition-all duration-200 transform hover:scale-105">
                <span id="btnText">Create Account</span>
                <div id="loadingSpinner" class="loading-spinner hidden ml-2"></div>
            </button>
        </form>

        <div class="mt-6 text-center slide-up">
            <p class="text-gray-600">
                Already have an account?
                <a href="/login" class="text-indigo-600 hover:text-indigo-500 font-medium">Sign in</a>
            </p>
        </div>

        <div id="errorMsg" class="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-center hidden slide-up">
            <i class="fas fa-exclamation-triangle mr-2"></i>
            <span id="errorText"></span>
        </div>

        <div id="successMsg" class="mt-4 p-3 bg-green-50 border border-green-200 rounded-lg text-green-700 text-center hidden slide-up">
            <i class="fas fa-check-circle mr-2"></i>
            Account created successfully! Redirecting...
        </div>
    </div>

    <script src="/static/js/register.js"></script>
</body>
</html>
